<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockRoomMV - Email & Notification</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 StockRoomMV</h1>
            <p>Email & Notification Center</p>
        </div>

        <!-- Status Messages -->
        <div id="status" class="status hidden"></div>

        <!-- Email Form -->
        <div class="card">
            <h2>✉️ Send Email</h2>
            <form id="emailForm">
                <div class="form-group">
                    <label>Recipient Email *</label>
                    <input type="email" id="toEmail" placeholder="customer@example.com" required />
                </div>

                <div class="form-group">
                    <label>Recipient Name</label>
                    <input type="text" id="toName" placeholder="Customer Name" />
                </div>

                <div class="form-group">
                    <label>Subject *</label>
                    <input type="text" id="subject" placeholder="Order Confirmation" required />
                </div>

                <div class="form-group">
                    <label>Message *</label>
                    <textarea id="message" rows="4" placeholder="Your message here..." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label>Order Number</label>
                        <input type="text" id="orderNumber" placeholder="#ORD-12345" />
                    </div>
                    <div class="form-group half">
                        <label>Order Total</label>
                        <input type="text" id="orderTotal" placeholder="99.99" />
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span id="sendBtnText">📤 Send Email</span>
                    <span id="sendBtnLoading" style="display:none;">⏳ Sending...</span>
                </button>
            </form>
        </div>

        <!-- Quick Templates -->
        <div class="card">
            <h2>📋 Quick Templates</h2>
            <div class="template-grid">
                <button class="btn-template" data-template="order">
                    📦 Order Confirmation
                </button>
                <button class="btn-template" data-template="shipping">
                    🚚 Shipping Update
                </button>
                <button class="btn-template" data-template="welcome">
                    👋 Welcome New User
                </button>
                <button class="btn-template" data-template="promotion">
                    🎉 Promotion Alert
                </button>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="card">
            <h2>📊 Recent Activity</h2>
            <div id="activityLog">
                <p class="empty-state">No activity yet. Send an email to see it here.</p>
            </div>
        </div>

        <!-- Test Email -->
        <div class="card test-card">
            <h2>🧪 Test Email</h2>
            <p>Send a test email to yourself to verify the system works.</p>
            <button id="testEmailBtn" class="btn btn-secondary">📧 Send Test Email</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
